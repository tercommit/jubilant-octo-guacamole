<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Petit Saut">
  <title>Petit Saut</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #222034;
      --text: #ffffff;
      --accent: #fbf236;
      --heart: #d95763;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Press Start 2P', monospace;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    #stage {
      position: absolute;
      inset: 0;
      margin: auto;
      width: min(100vw, calc(100vh * 16 / 9));
      height: min(100vh, calc(100vw * 9 / 16));
      width: min(100vw, calc(100dvh * 16 / 9));
      height: min(100dvh, calc(100vw * 9 / 16));
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    #hud {
      position: absolute;
      top: 0; left: 0; right: 0;
      display: flex;
      justify-content: space-between;
      padding: 2.5% 3%;
      font-size: clamp(8px, 1.8vw, 18px);
      text-shadow: 2px 2px 0 var(--bg);
      pointer-events: none;
    }
    #lives { color: var(--heart); letter-spacing: 0.2em; }
    #coins::before { content: '● '; color: var(--accent); }
    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5em;
      text-align: center;
      background: rgba(34, 32, 52, 0.7);
      font-size: clamp(8px, 1.6vw, 16px);
      line-height: 2;
      padding: 16px;
    }
    #overlay[hidden] { display: none; }
    #overlay h1 {
      margin: 0;
      color: var(--accent);
      font-size: 2.4em;
      text-shadow: 4px 4px 0 var(--heart);
    }
    #overlay p { margin: 0; }
    #new-game {
      font: inherit;
      color: var(--bg);
      background: var(--accent);
      border: 0;
      padding: 0.8em 1.2em;
      box-shadow: 3px 3px 0 var(--heart);
      cursor: pointer;
    }
    #new-game[hidden] { display: none; }
    .controls { opacity: 0.8; font-size: 0.8em; }
    #touch {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      display: none;
      justify-content: space-between;
      padding: 16px;
      padding-left: max(16px, env(safe-area-inset-left));
      padding-right: max(16px, env(safe-area-inset-right));
      padding-bottom: max(16px, env(safe-area-inset-bottom));
      pointer-events: none;
    }
    #touch button {
      pointer-events: auto;
      width: 64px; height: 64px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.6);
      background: rgba(34, 32, 52, 0.45);
      color: var(--text);
      font-size: 24px;
      touch-action: none;
    }
    #touch .dpad { display: flex; gap: 16px; }
    @media (pointer: coarse) {
      #touch { display: flex; }
      .controls .keys { display: none; }
    }
    @media (pointer: fine) {
      .controls .tap { display: none; }
    }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="game" width="320" height="180"></canvas>
    <div id="hud">
      <span id="lives"></span>
      <span>Niveau <span id="level"></span></span>
      <span id="coins"></span>
    </div>
    <div id="overlay">
      <h1 id="overlay-title">Petit Saut</h1>
      <p id="overlay-text"></p>
      <button id="new-game" hidden>Nouvelle partie</button>
      <p class="controls">
        <span class="keys">← → ou Q / D : bouger · Espace, ↑ ou Z : sauter · P : pause</span>
        <span class="tap">Boutons en bas de l'écran</span>
      </p>
    </div>
  </div>

  <div id="touch">
    <div class="dpad">
      <button data-action="left" aria-label="Gauche">◀</button>
      <button data-action="right" aria-label="Droite">▶</button>
    </div>
    <button data-action="jump" aria-label="Sauter">▲</button>
  </div>

  <!-- Affiche les erreurs à l'écran : utile pour comprendre un problème sur téléphone. -->
  <script>
    window.addEventListener('error', function (e) {
      var box = document.getElementById('error') || document.body.appendChild(document.createElement('pre'));
      box.id = 'error';
      box.style.cssText = 'position:fixed;left:8px;right:8px;bottom:8px;margin:0;padding:8px;background:#fff;color:#c00;font:12px monospace;white-space:pre-wrap;z-index:9';
      box.textContent += 'Erreur : ' + e.message + ' (' + (e.filename || '').split('/').pop() + ':' + e.lineno + ')\n';
    });
  </script>
  <!-- Le paramètre ?v= force le navigateur à recharger les scripts après chaque mise à jour. -->
  <script src="sprites.js?v=4"></script>
  <script src="levels.js?v=4"></script>
  <script src="game.js?v=4"></script>
</body>
</html>
